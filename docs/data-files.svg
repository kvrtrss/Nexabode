<svg xmlns="http://www.w3.org/2000/svg" width="508" height="184" viewBox="0 0 508 184" role="img" aria-label="Nexabode data files in %LocalAppData%\Nexabode: nexabode.db encrypted database, db.key encryption key protected by Windows DPAPI, settings.json application settings, SafetyCopies folder with safety copies created before a restore.">
