<text class="m" x="24" y="36" fill="#000000" font-size="13" font-weight="700" letter-spacing="2.5">DATA / %LOCALAPPDATA%\NEXABODE</text>
<line x1="24" y1="46" x2="476" y2="46" stroke="#5c5c5c" stroke-width="1"/><text class="m" x="24" y="76" fill="#000000" font-size="13" font-weight="700">nexabode.db</text><text class="m" x="476" y="76" fill="#5c5c5c" font-size="11" letter-spacing="1" text-anchor="end">ENCRYPTED DATABASE</text><text class="m" x="24" y="104" fill="#000000" font-size="13" font-weight="700">db.key</text><text class="m" x="476" y="104" fill="#5c5c5c" font-size="11" letter-spacing="1" text-anchor="end">KEY, PROTECTED BY WINDOWS DPAPI</text><text class="m" x="24" y="132" fill="#000000" font-size="13" font-weight="700">settings.json</text><text class="m" x="476" y="132" fill="#5c5c5c" font-size="11" letter-spacing="1" text-anchor="end">THEME + REPORT HEADER</text><text class="m" x="24" y="160" fill="#000000" font-size="13" font-weight="700">SafetyCopies\</text><text class="m" x="476" y="160" fill="#5c5c5c" font-size="11" letter-spacing="1" text-anchor="end">SNAPSHOTS BEFORE A RESTORE</text>
