<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Nexabode specs: version 1.0.0, Windows 10 and 11, .NET 10, SQLCipher 4 database, MIT license">
<title>Nexabode specs</title>

  <style>
    /* ---------- Shared styles ---------- */
    .m  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .lb { font-size: 11px; letter-spacing: 1px; fill: #5c5c5c; }                     /* row label */
    .v  { font-size: 14px; font-weight: 700; text-anchor: end; fill: #000000; }      /* row value */
    .ic {                                                                             /* row icon */
      fill: none;
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Animations ---------- */
    .cu { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink {
      0%, 50%      { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    .orb {
      transform-origin: 322px 140px;   /* ring center */
      animation: orbit 10s linear infinite;
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- ========== Card: drop shadow + white body with border ========== -->
  <rect x="8" y="8" width="390" height="220" fill="#c4c4c4"/>
  <rect x="2" y="2" width="390" height="220" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ========== Header ========== -->
  <text class="m" x="24" y="36" fill="#000000" font-size="13" font-weight="700" letter-spacing="2.5">NEXABODE / SPECS</text>
  <rect class="cu" x="190.8" y="25" width="8" height="13" fill="#000000"/>
  <line x1="24" y1="46" x2="368" y2="46" stroke="#5c5c5c" stroke-width="1"/>

  <!-- ========== Spec rows ========== -->
  <!-- Version -->
  <g class="ic" transform="translate(24,69)">
    <polygon points="1,1 8,1 13,7 7,13 1,7"/><circle cx="4.5" cy="4.5" r="1"/>
  </g>
  <text class="m lb" x="46" y="80">VERSION</text>
  <text class="m v" x="246" y="80">1.1.1</text>

  <!-- Platform -->
  <g class="ic" transform="translate(24,97)">
    <rect x="1" y="2" width="12" height="8" rx="1"/><line x1="5" y1="13" x2="9" y2="13"/><line x1="7" y1="10" x2="7" y2="13"/>
  </g>
  <text class="m lb" x="46" y="108">PLATFORM</text>
  <text class="m v" x="246" y="108">WINDOWS 10/11</text>

  <!-- Runtime -->
  <g class="ic" transform="translate(24,125)">
    <polygon points="7,1 13,4 13,10 7,13 1,10 1,4"/><polyline points="1,4 7,7 13,4"/><line x1="7" y1="7" x2="7" y2="13"/>
  </g>
  <text class="m lb" x="46" y="136">RUNTIME</text>
  <text class="m v" x="246" y="136">.NET 10</text>

  <!-- Database -->
  <g class="ic" transform="translate(24,153)">
    <ellipse cx="7" cy="3" rx="5" ry="2"/><path d="M2 3 V11 A5 2 0 0 0 12 11 V3"/><path d="M2 7 A5 2 0 0 0 12 7"/>
  </g>
  <text class="m lb" x="46" y="164">DATABASE</text>
  <text class="m v" x="246" y="164">SQLCIPHER 4</text>

  <!-- License -->
  <g class="ic" transform="translate(24,181)">
    <rect x="2" y="1" width="10" height="12" rx="1"/><polyline points="4.5,7 6.5,9 9.5,5"/>
  </g>
  <text class="m lb" x="46" y="192">LICENSE</text>
  <text class="m v" x="246" y="192">MIT</text>

  <!-- ========== Release ring (center 322,140) ========== -->
  <circle cx="322" cy="140" r="46" fill="none" stroke="#5c5c5c" stroke-width="0.6" stroke-dasharray="1 4"/>
  <circle cx="322" cy="140" r="34" fill="none" stroke="#c4c4c4" stroke-width="6"/>
  <circle cx="322" cy="140" r="34" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-dasharray="213.6 0" transform="rotate(-90 322 140)"/>
  <text class="m" x="322" y="148" text-anchor="middle" fill="#000000" font-size="22" font-weight="700">v1.1</text>
  <g class="orb">
    <circle cx="322" cy="94" r="3" fill="#000000"/>
  </g>
</svg>
