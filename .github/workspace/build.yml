name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Cancel an older run if a newer one starts on the same branch (saves minutes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10   # hard stop so a stuck run can never burn minutes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Nexabode/Nexabode.slnx -c Release

      # Runs only once a test project exists in the repository.
      - name: Test
        if: ${{ hashFiles('**/*.Tests.csproj') != '' }}
        run: dotnet test Nexabode.Tests/Nexabode.Tests.csproj -c Release
